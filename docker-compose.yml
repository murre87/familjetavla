# Familjetavla utan Home Assistant-tillägg (t.ex. HA Container, NAS eller egen server).
# Starta: docker compose up -d  → öppna http://<datorn>:8099
services:
  familjetavla:
    image: ghcr.io/murre87/familjetavla:latest
    # build: .            # eller bygg själv från källkoden
    container_name: familjetavla
    restart: unless-stopped
    init: true
    ports:
      - "8099:8099"
      # - "8443:8443"                     # https (kräver certifikatet nedan)
    volumes:
      - ./data:/data
      # Https med samma certifikat som Home Assistant: mappen med fullchain.pem och privkey.pem.
      # - /sökväg/till/homeassistant/ssl:/ssl:ro
      # Let's Encrypt (certbot): live/<namn> innehåller länkar till archive/<namn>, så montera hela mappen och peka ut filerna:
      # - /etc/letsencrypt:/le:ro        och under environment: SSL_CERT=/le/live/<namn>/fullchain.pem, SSL_KEY=/le/live/<namn>/privkey.pem
      # Inne i hemmanätet måste certifikatets namn peka på den här datorn (lokal DNS-post i routern), annars når plattan inte https.
    labels:
      - com.centurylinklabs.watchtower.enable=true      # uppdateras automatiskt av tjänsten watchtower nedan (eller din egen Watchtower med --label-enable)
    environment:
      - TZ=Europe/Stockholm
      # - BROWSER_WS_URL=ws://browserless:3000   # extern webbläsare för Willys (valfritt)
      # - HTTPS_HOST=hemma.example.org            # adressen som visas för https, om certifikatet gäller flera namn

  # Hämtar nya versioner av tavlan automatiskt (var sjätte timme) och startar om den. Inställningarna ligger kvar i ./data.
  # Vill du uppdatera själv: ta bort den här tjänsten, och kör `docker compose pull && docker compose up -d` när du vill.
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: familjetavla-watchtower
    restart: unless-stopped
    command: --label-enable --cleanup --interval 21600
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
