name: Bygg image

# Bygger Docker-images till GitHub Container Registry och släpper sedan versionen:
#   ghcr.io/<ägare>/familjetavla:<version> och :latest  (multi-arch, för docker compose)
#   ghcr.io/<ägare>/familjetavla-amd64 / -aarch64     (för Home Assistant-tillägget)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  # The fast unit tests here, and the full end-to-end run (every screen, the real image) is required to have passed
  # already on this very commit – main runs it on every merge. Nothing is published unless both are green.
  checks:
    uses: ./.github/workflows/ci.yml
    with:
      fast: true

  main-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Kräv grön CI på samma commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # No run yet (a tag set a second after the merge) is waited for; no run at all within 5 minutes is an error.
          for i in $(seq 1 180); do
            r=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${{ github.sha }}&event=push&per_page=1" --jq '.workflow_runs[0] | "\(.status) \(.conclusion)"' 2>/dev/null || echo "")
            echo "$(date +%H:%M) CI på ${{ github.sha }}: ${r:-ingen körning ännu}"
            case "$r" in
              "completed success") exit 0 ;;
              completed*) echo "CI på den här commiten blev inte grön – släpper inte."; exit 1 ;;
              "" | null*) [ "$i" -ge 10 ] && { echo "Ingen CI-körning på commiten. Tagga en commit på main som CI har kört på."; exit 1; } ;;
            esac
            sleep 30
          done
          echo "CI blev inte klar inom 90 minuter."; exit 1

  image:
    needs: [checks, main-ci]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version
        id: v
        run: |
          # The version to build comes from package.json. familjetavla/config.yaml is only raised
          # by the "release" job below, after the images exist – Home Assistant offers the update
          # as soon as config.yaml on main changes, and would otherwise hit "manifest unknown".
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/familjetavla-${{ matrix.arch }}:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/familjetavla-${{ matrix.arch }}:latest
          labels: |
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ steps.v.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  manifest:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Multi-arch tag
        run: |
          V=$(node -p "require('./package.json').version")
          O=ghcr.io/${{ github.repository_owner }}
          for T in "$V" latest; do
            docker buildx imagetools create -t "$O/familjetavla:$T" "$O/familjetavla-amd64:$V" "$O/familjetavla-aarch64:$V"
          done

  # Only now tell Home Assistant (and the board's "Ny version finns") that the version exists.
  release:
    needs: manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      # The version is the tagged commit's, not main's: main may already be on the next version.
      - name: Pull the images once more – never announce a version that cannot be pulled
        run: |
          V=$(git show "${{ github.sha }}:package.json" | node -p "JSON.parse(require('fs').readFileSync(0)).version")
          echo "V=$V" >> "$GITHUB_ENV"
          for I in familjetavla familjetavla-amd64 familjetavla-aarch64; do
            docker manifest inspect "ghcr.io/${{ github.repository_owner }}/$I:$V" > /dev/null
          done
      - name: Raise the add-on version
        run: |
          CUR=$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\}/\1/p' familjetavla/config.yaml)
          if [ "$(printf '%s\n%s\n' "$V" "$CUR" | sort -V | tail -1)" != "$V" ]; then
            echo "config.yaml already says $CUR, newer than $V – leaving it"; exit 0
          fi
          sed -i "s/^version: .*/version: \"$V\"/" familjetavla/config.yaml
          if git diff --quiet; then echo "config.yaml already says $V"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Släpp $V till Home Assistant (images finns på ghcr)"
          git push origin HEAD:main
