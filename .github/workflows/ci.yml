name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release runs the fast checks (test) and requires that the full run already passed on the same commit.
  workflow_call:
    inputs:
      fast:
        type: boolean
        default: false
        description: Only the fast unit tests (the release checks the full run on main instead)

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # familjetavla/config.yaml is the version Home Assistant offers for update: only the release job raises it, after the images exist.
      # A pull request that changes it makes Home Assistant offer a version that cannot be pulled yet (404, "manifest unknown").
      - name: Add-on-versionen höjs bara av release-jobbet
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          if git diff "origin/${{ github.base_ref }}" HEAD -- familjetavla/config.yaml | grep -E '^[+-]version:'; then
            echo "::error file=familjetavla/config.yaml::Ändra inte version: i pull requesten. Release-jobbet höjer den när images finns på ghcr (annars erbjuder Home Assistant en version som inte går att hämta). Höj package.json-versionerna i stället."
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Every screen on every device class, in five parts at the same time (two devices each) instead of one hour in a row.
  screens:
    if: ${{ !inputs.fast }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: ["1/5", "2/5", "3/5", "4/5", "5/5"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - name: Alla skärmar (iPad, Android-platta, mobil, iPhone) – del ${{ matrix.part }}
        run: npm run build:demo -w web && PART=${{ matrix.part }} node e2e/devices.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skarmar-${{ strategy.job-index }}
          path: e2e/shots

  # Build the real image and use it like a family would: as a Home Assistant add-on behind
  # ingress (with a stand-in Supervisor at the Supervisor's address) and as a plain Docker
  # container. A real browser goes through the setup guide and the board.
  e2e:
    if: ${{ !inputs.fast }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      # Same build as the release, Chromium included.
      - run: docker build -t familjetavla-test .
      - name: Home Assistant-tillägg via ingress
        run: |
          wait_for() { for i in $(seq 1 45); do curl -fsS -o /dev/null "$1" && return 0; sleep 2; done; echo "svarar inte: $1"; return 1; }
          docker network create --subnet 172.30.32.0/23 hassio
          docker run -d --name supervisor --network hassio --ip 172.30.32.2 --network-alias supervisor -p 8123:80 \
            -v "$PWD/e2e:/e2e:ro" -e ADDON_URL=http://familjetavla:8099 -e HA_TOKEN=e2e-supervisor-token -e TZ=Europe/Stockholm \
            node:22-slim node /e2e/mock-supervisor.mjs
          docker run -d --name familjetavla --network hassio --ip 172.30.33.10 --network-alias familjetavla \
            -e SUPERVISOR_TOKEN=e2e-supervisor-token -v addon-data:/data familjetavla-test
          wait_for http://localhost:8123/api/hassio_ingress/e2e-token/
          node e2e/run.mjs http://localhost:8123/api/hassio_ingress/e2e-token/ addon
          docker restart familjetavla
          wait_for http://localhost:8123/api/hassio_ingress/e2e-token/
          EXPECT_TEXT="Middag hos mormor" node e2e/run.mjs http://localhost:8123/api/hassio_ingress/e2e-token/ restart
          echo "Anrop till Home Assistant:"; curl -fsS http://localhost:8123/__calls; echo
      - name: Inne i imagen
        run: |
          echo "Chromium (för Willys/Hemköp) startar med Playwright:"
          docker exec -w /app familjetavla node --input-type=module -e "
            import { chromium } from 'playwright-core';
            const b = await chromium.launch({ executablePath: process.env.CHROMIUM_PATH, args: ['--no-sandbox'] });
            const p = await b.newPage(); await p.setContent('<h1>ok</h1>');
            console.log('chromium', b.version(), await p.textContent('h1')); await b.close();"
          echo "Stängs snabbt vid stopp (SIGTERM):"
          start=$(date +%s); docker stop familjetavla > /dev/null; took=$(( $(date +%s) - start ))
          echo "docker stop tog ${took}s"; test "$took" -le 5
      - name: Docker på port 8099 utan Home Assistant
        run: |
          docker run -d --name ft-docker -p 8099:8099 -v docker-data:/data familjetavla-test
          for i in $(seq 1 45); do curl -fsS -o /dev/null http://localhost:8099/ && break; sleep 2; done
          node e2e/run.mjs http://localhost:8099/ docker
      - name: Loggar
        if: always()
        run: |
          for c in familjetavla ft-docker supervisor; do echo "=== $c"; docker logs "$c" 2>&1 | tail -60 || true; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skarmbilder
          path: e2e/shots
